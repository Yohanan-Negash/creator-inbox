name: Release

on:
  pull_request:
    branches:
      - main
    types:
      - closed

permissions:
  contents: write
  pull-requests: read

concurrency: ${{ github.workflow }}-${{ github.event.pull_request.base.ref }}

jobs:
  release:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Compute release metadata from labels
        id: metadata
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const labels = pr.labels.map((label) => label.name);
            const primaryLabels = ["feat", "fix", "enhancement", "chore", "docs"];
            const selectedPrimary = primaryLabels.filter((label) => labels.includes(label));

            if (selectedPrimary.length !== 1) {
              core.setFailed(
                `Exactly one primary label is required: ${primaryLabels.join(", ")}. Found: ${selectedPrimary.join(", ") || "none"}.`
              );
              return;
            }

            const primary = selectedPrimary[0];
            const bump = labels.includes("breaking") ? "major" : primary === "feat" ? "minor" : "patch";
            const normalizedTitle = pr.title.replace(/\s+/g, " ").trim();
            const summary = `${primary}: ${normalizedTitle}`;

            core.setOutput("bump", bump);
            core.setOutput("summary", summary);

      - name: Create release changeset
        run: |
          file=".changeset/release-pr-${{ github.event.pull_request.number }}-${{ github.run_id }}.md"
          cat > "$file" <<EOF
          ---
          "creator-inbox": ${{ steps.metadata.outputs.bump }}
          ---

          ${{ steps.metadata.outputs.summary }}
          EOF

      - name: Apply release version
        run: pnpm version-packages

      - name: Commit and push release changes
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "No release changes to commit"
            echo "version=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          version=$(node -p "require('./package.json').version")
          git commit -m "chore: release v${version}"
          git push origin HEAD:main

          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        if: steps.commit.outputs.version != ''
        run: pnpm release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
