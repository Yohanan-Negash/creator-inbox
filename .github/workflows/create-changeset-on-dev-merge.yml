name: Create Changeset on Dev Merge

on:
  pull_request:
    branches:
      - dev
    types:
      - closed

permissions:
  contents: write
  pull-requests: read

jobs:
  create-changeset:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Compute changeset metadata from labels
        id: metadata
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const labels = pr.labels.map((label) => label.name);

            const primaryOrder = ["feat", "fix", "enhancement", "chore", "docs"];
            const selectedPrimary = primaryOrder.filter((label) => labels.includes(label));

            if (selectedPrimary.length !== 1) {
              core.setFailed(
                `Expected exactly one primary label (${primaryOrder.join(", ")}), found: ${selectedPrimary.join(", ") || "none"}.`
              );
              return;
            }

            const primary = selectedPrimary[0];
            const bump = labels.includes("breaking") ? "major" : primary === "feat" ? "minor" : "patch";
            const normalizedTitle = pr.title.replace(/\s+/g, " ").trim();
            const summary = `${primary}: ${normalizedTitle}`;

            core.setOutput("bump", bump);
            core.setOutput("summary", summary);

      - name: Write changeset file
        run: |
          file=".changeset/pr-${{ github.event.pull_request.number }}-${{ github.run_id }}.md"
          cat > "$file" <<EOF
          ---
          "creator-inbox": ${{ steps.metadata.outputs.bump }}
          ---

          ${{ steps.metadata.outputs.summary }}
          EOF

      - name: Commit changeset to dev
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git add .changeset
          git commit -m "chore: add changeset for #${{ github.event.pull_request.number }}"

          for attempt in 1 2 3; do
            if git push origin dev; then
              exit 0
            fi

            echo "Push failed, rebasing and retrying (attempt $attempt)"
            git pull --rebase origin dev
          done

          echo "Failed to push changeset commit after retries"
          exit 1
