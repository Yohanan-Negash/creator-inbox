name: PR Label Policy

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
      - labeled
      - unlabeled

jobs:
  validate-labels:
    runs-on: ubuntu-latest
    steps:
      - name: Validate release labels
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;

            if (pr.draft) {
              core.info("Draft PR: skipping label validation until ready for review.");
              return;
            }

            const labels = pr.labels.map((label) => label.name);
            const primaryLabels = ["feat", "fix", "enhancement", "chore", "docs"];
            const selectedPrimary = primaryLabels.filter((label) => labels.includes(label));

            if (selectedPrimary.length !== 1) {
              core.setFailed(
                `Exactly one primary label is required: ${primaryLabels.join(", ")}. Found: ${selectedPrimary.join(", ") || "none"}.`
              );
              return;
            }

            core.info(
              `Label policy passed with primary label '${selectedPrimary[0]}'${labels.includes("breaking") ? " and 'breaking' override" : ""}.`
            );
